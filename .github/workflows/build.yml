name: Build AppLockManager.tipa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applock-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install build dependencies
        run: |
          echo /usr/local/opt/make/libexec/gnubin >> "$GITHUB_PATH"
          echo /opt/homebrew/opt/make/libexec/gnubin >> "$GITHUB_PATH"
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 \
            brew install dpkg ldid-procursus make xcbeautify openssl@3

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 942cd0c015f93d8c2d714ba0c69e7f420157c382
          path: theos

      - name: Checkout Theos package tool
        uses: actions/checkout@v4
        with:
          repository: theos/dm.pl
          path: theos/vendor/dm.pl

      - name: Prepare Theos SDK directory
        run: rm -rf theos/sdks

      - name: Checkout Theos SDKs
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos/sdks

      - name: Build TIPA and dylib
        env:
          THEOS: ${{ github.workspace }}/theos
          FINALPACKAGE: "1"
        run: make package

      - name: Inspect dylib
        run: |
          file build/AppLock.dylib
          xcrun otool -L build/AppLock.dylib

      - name: Upload AppLockManager.tipa
        uses: actions/upload-artifact@v4
        with:
          name: AppLockManager-tipa
          path: packages/AppLockManager_*.tipa
          if-no-files-found: error

      - name: Upload standalone dylib
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-dylib
          path: build/AppLock.dylib
          if-no-files-found: error
