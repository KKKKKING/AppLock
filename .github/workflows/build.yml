name: Build AppLock.dylib

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Build and inspect dylib
        run: make clean verify

      - name: Upload AppLock.dylib
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-dylib
          path: build/AppLock.dylib
          if-no-files-found: error
